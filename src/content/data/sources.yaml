- id: N-T1-1
  title: "AAIDD: Defining Criteria for Intellectual Disability (Wayback Machine copy of aaidd.org/intellectual-disability/definition, captured 2025-01-02)"
  url: "https://web.archive.org/web/20250102032345/https://www.aaidd.org/intellectual-disability/definition"
  accessedOn: "2026-11-23"
  quote: "Intellectual disability is a condition characterized by significant limitations in both intellectual functioning and adaptive behavior that originates before the age of 22. [...] Adaptive behavior is the collection of conceptual, social, and practical skills that are learned and performed by people in their everyday lives."
  note: "The live aaidd.org page returned HTTP 403 to automated clients; the archived copy was read instead. The two sentences are separated by the intellectual-functioning paragraph."
- id: N-T1-2
  title: "Tasse, M. J., et al. (2012). The construct of adaptive behavior: Its conceptualization, measurement, and use in the field of intellectual disability. American Journal on Intellectual and Developmental Disabilities, 117(4), 291-303. Crossref abstract"
  url: "https://api.crossref.org/works/10.1352/1944-7558-117.4.291"
  accessedOn: "2026-11-23"
  quote: "An understanding of the construct of adaptive behavior and its measurement is critical to clinicians and practitioners in the field because of its role in understanding the phenomenon of intellectual disability, diagnosing a person with intellectual disability, providing a framework for person-referenced education and habilitation goals, and focusing on an essential dimension of human functioning."
- id: N-T1-3
  title: "Oakland, T., Iliescu, D., Chen, H.-Y., & Chen, J. H. (2013). Cross-national assessment of adaptive behavior in three countries. Journal of Psychoeducational Assessment, 31(5), 435-447. Crossref abstract"
  url: "https://api.crossref.org/works/10.1177/0734282912469492"
  accessedOn: "2026-11-23"
  quote: "This present article describes the Romanian and Taiwan adaptation process of the U.S.-developed Adaptive Behavior Assessment System, Second Edition (ABAS-II) Parent Form for ages 5 to 21. Data from more than 3,000 parents who completed the ABAS-II are examined across these three test versions, focusing on score differences, internal consistency, intercorrelations, and factor structure equivalence."
  note: "Verbatim; the Crossref text writes 'U.S.-developed' with an en dash, shown here with a hyphen. Two more abstract sentences used: 'Measures that assess adaptive behaviors typically have been built in Western cultures and developed in light of behaviors common to them.' and 'Data from the three versions display considerable similarity.'"
- id: N-T1-4
  title: "Texas Autism Network: ABAS-3 page (same page as existing source S17; extra passages used)"
  url: "https://www.txautism.net/evaluations/adaptive-behavior-assessment-system-third-edition"
  accessedOn: "2026-11-23"
  quote: "The ABAS-3 can be used to develop treatment plans and training goals, document and monitor progress over time, determine eligibility for services such as Social Security disability benefits, and evaluate ability to live and work independently. Information on children may be provided by parents and/or teachers; information on adults may be provided by significant others, care providers, supervisors, and/or the client himself/herself."
- id: N-T1-5
  title: "APA Division 16, The School Psychologist, Fall 2015 (same document as existing source S12; extra passage used)"
  url: "https://apadivision16.org/wp-content/uploads/2015/11/TSP-Fall-2015.pdf"
  accessedOn: "2026-11-23"
  quote: "He developed tests in the areas of student styles, test session behavior, and adaptive behavior."
- id: N-T2-1
  title: "Buros Center for Testing: Student Styles Questionnaire review entry"
  url: "https://marketplace.unl.edu/buros/test-reviews/alphabetical-list/student-styles-questionnairetm.html"
  accessedOn: "2026-11-23"
  quote: "Designed to detect individual differences students display in their preferences, temperaments, and personal styles."
- id: N-T2-2
  title: "Oakland, T., & Joyce, D. (2004). Temperament-based learning styles and school-based applications. Canadian Journal of School Psychology, 19(1-2), 59-74 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1177/082957350401900103"
  accessedOn: "2026-11-23"
  quote: "Four temperament qualities and their origins are described together with the influence of temperament styles on teaching and learning styles. Teachers are encouraged to provide opportunities for students to utilize their strengths, to overcome weaknesses, to encourage positive behaviors, to promote an understanding of themselves and others, and to identify vocational interests."
- id: N-T2-3
  title: "Calluen, C., & Oakland, T. (2014). If you do not know the child's temperament you do not know the child. Estudos de Psicologia (Campinas), 31(1), 3-14 (Crossref abstract), eight styles"
  url: "https://api.crossref.org/works/10.1590/0103-166x2014000100001"
  accessedOn: "2026-11-23"
  quote: "This paper focuses on Oakland and colleagues' approach to temperament in children ages 8-17 in terms of the eight basic styles that are grouped into four bipolar traits: extroverted or introverted, practical or imaginative, thinking or feeling, and organized or flexible styles."
- id: N-T2-4
  title: "Benson, N., Oakland, T., & Shermis, M. (2008). Cross-national invariance of children's temperament. Journal of Psychoeducational Assessment, 27(1), 3-16 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1177/0734282908318563"
  accessedOn: "2026-11-23"
  quote: "Development of the SSQ was based on Jung's theory of temperament as augmented by Myers and Briggs. A four bipolar dimension model provided an excellent fit for Australian, Chinese, Costa Rican, Philippine, United States, and Zimbabwean samples and modest fit for Gaza (Palestinian) and Nigerian samples."
- id: N-T2-5
  title: "Oakland, T., Joyce, D. D., Horton, C., & Glutting, J. (2000). Temperament-based learning styles of identified gifted and nongifted students. Gifted Child Quarterly, 44(3), 183-189 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1177/001698620004400304"
  accessedOn: "2026-11-23"
  quote: "Students identified as gifted and nongifted students did not differ significantly on extroverted-introverted, organlzed-flexible, and thinking-feeling styles. Students identified as gifted displayed a stronger preference for imagnative styles, while nongifted children displayed a stronger preference for practical styles."
- id: N-T2-6
  title: "Stafford, M. E., & Oakland, T. D. (1996). Validity of temperament constructs using the Student Styles Questionnaire. Journal of Psychoeducational Assessment, 14(2), 109-120 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1177/073428299601400202"
  accessedOn: "2026-11-23"
  quote: "The SSQ is a temperament measure for students aged 8 through 17. Comparative construct validity results indicate that a high degree of factor similarity exists across racial-ethnic groups; factor similarity is less strong when Hispanic Americans living in New York and Texas are compared."
- id: N-T2-7
  title: "Oakland, T., & colleague (2006). Temperament styles of children from the People's Republic of China and the United States. School Psychology International, 27(2), 192-208 (Crossref abstract; Crossref spells the second author 'Lub, Li')"
  url: "https://api.crossref.org/works/10.1177/0143034306064545"
  accessedOn: "2026-11-23"
  quote: "Compared to US children, Chinese children are more likely to prefer practical, thinking and organized styles; these differences were found within boys and girls from the two countries. Temperament preferences displayed by Chinese and US children may reflect qualities important to values prominent in either a collectivist or individualist society."
- id: N-T2-8
  title: "Calluen, C., & Oakland, T. (2014). If you do not know the child's temperament you do not know the child (Crossref abstract), definition of temperament"
  url: "https://api.crossref.org/works/10.1590/0103-166x2014000100001"
  accessedOn: "2026-11-23"
  quote: "Current scholarship generally characterizes temperament as stylistic and relatively stable traits that subsume intrinsic tendencies to act and react in somewhat predictable ways to people, events, and other stimuli. An understanding of children's temperament preferences aids our understanding of the origins of behaviors as well as normal attitudes children display at home, school, and elsewhere."
