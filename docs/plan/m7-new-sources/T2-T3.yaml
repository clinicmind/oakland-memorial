  title: "Oakland, T. (2010). Cross-cultural and cross-national assessment. In The Corsini Encyclopedia of Psychology (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1002/9780470479216.corpsy0242"
  accessed: "2026-11-23"
  quote: "Cross-cultural assessment refers to the practice of acquiring test data on persons who differ culturally."
- id: N-T3-11
  title: "Oakland, T., Douglas, S., & Kane, H. (2016). Top ten standardized tests used internationally with children and youth by school psychologists in 64 countries. Journal of Psychoeducational Assessment, 34(2), 166-176 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1177/0734282915595303"
  accessed: "2026-11-23"
  quote: "Data were acquired from 64 countries through an international survey, with one respondent from each country."
- id: N-T3-12
  title: "International Test Commission (2017). The ITC Guidelines for Translating and Adapting Tests (Second edition), version 2.4, pre-condition decisions"
  url: "https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"
  accessed: "2026-11-23"
  quote: "The first section named \"Pre-Condition\" highlights the fact that decisions have to be made before the translation/adaptation process ever begins."
- id: N-T3-13
  title: "International Test Commission (2017). The ITC Guidelines for Translating and Adapting Tests (Second edition), version 2.4, definition of adaptation"
  url: "https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"
  accessed: "2026-11-23"
  quote: "Test adaptation refers to all of the activities including: deciding whether or not a test in a second language and culture could measure the same construct in the first language; selecting translators; choosing a design for evaluating the work of test translators (e.g., forward and backward translations); choosing any necessary accommodations; modifying the test format; conducting the translation; checking the equivalence of the test in the second language and culture and conducting other necessary validity studies."
- id: N-T2-9
  title: "Stafford, M. E., & Oakland, T. D. (1996), Crossref abstract, item-level differences"
  url: "https://api.crossref.org/works/10.1177/073428299601400202"
  accessed: "2026-11-23"
  quote: "Differential item functioning studies reveal similar response patterns for Hispanic Americans when compared to both African Americans and Anglo Americans; however, differences occur on 25% of items when African and Anglo Americans are compared."
- id: N-T3-14
  title: "Oakland, T., Iliescu, D., Chen, H.-Y., & Chen, J. H. (2013), Crossref abstract, scope and steps"
  url: "https://api.crossref.org/works/10.1177/0734282912469492"
  accessed: "2026-11-23"
  quote: "This present article describes the Romanian and Taiwan adaptation process of the U.S.-developed Adaptive Behavior Assessment System, Second Edition (ABAS-II) Parent Form for ages 5 to 21. Steps taken to help ensure a valid translation and cultural adaptation process are described."
- id: N-T3-15
  title: "Oakland, T., Iliescu, D., Chen, H.-Y., & Chen, J. H. (2013), Crossref abstract, data and comparisons"
  url: "https://api.crossref.org/works/10.1177/0734282912469492"
  accessed: "2026-11-23"
  quote: "Data from more than 3,000 parents who completed the ABAS-II are examined across these three test versions, focusing on score differences, internal consistency, intercorrelations, and factor structure equivalence. Data from the three versions display considerable similarity."
