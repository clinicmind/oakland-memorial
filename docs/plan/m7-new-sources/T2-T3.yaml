  title: "Oakland, T. (2016). A brief history of the International Test Commission. In The ITC International Handbook of Testing and Assessment (pp. 29-34). Oxford University Press (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1093/med:psych/9780199356942.003.0003"
  accessed: "2026-11-23"
  quote: "Now the ITC's primary goal is to assist in the exchange of information on test development and test use among its members and affiliate organizations, as well as with non-member societies, organizations, and individuals who desire to improve test-related practices."
- id: N-T3-8
  title: "Oakland, T., Poortinga, Y. H., Schlegel, J., & Hambleton, R. K. (2001). International Test Commission: Its history, current status, and future directions. International Journal of Testing, 1(1), 3-32 (abstract via OpenAlex)"
  url: "https://api.openalex.org/works/doi:10.1207/s15327574ijt0101_2"
  accessed: "2026-11-23"
  quote: "The history of the International Test Commission (ITC) is described beginning with its conception by Jean Cardinet in the mid-1960s, its birth in 1976, through the year 2000."
- id: N-T3-9
  title: "Oakland, T. (2016). Testing and assessment of immigrants and second-language learners. In The ITC International Handbook of Testing and Assessment (pp. 318-332). Oxford University Press (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1093/med:psych/9780199356942.003.0022"
  accessed: "2026-11-23"
  quote: "This review considers five topics that may impact the assessment of examinees whose cultural and linguistic qualities differ from the local or host culture: qualities associated with culture and language, personal qualities that are assessed, psychometric properties of tests, interpersonal relationships between the examinee and the assessment specialist, and ethical issues."
