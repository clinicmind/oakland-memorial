  url: "https://www.intestcom.org/page/16"
  accessed: "2026-11-23"
  quote: "The ITC guidelines bear directly on furthering the goals of the ITC."
- id: N-T3-2
  title: "International Test Commission (2017). The ITC Guidelines for Translating and Adapting Tests (Second edition), version 2.4, translation versus adaptation"
  url: "https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"
  accessed: "2026-11-23"
  quote: "Test translation is only a part of the adaptation process, but can be, on its own, a very simplistic approach to transporting a test from one language to another with no regard for educational or psychological equivalence."
- id: N-T3-3
  title: "Oakland, T. (2004). Use of educational and psychological tests internationally. Applied Psychology, 53(2), 157-172 (Crossref abstract)"
  url: "https://api.crossref.org/works/10.1111/j.1464-0597.2004.00166.x"
  accessed: "2026-11-23"
  quote: "The history of test development and use, external and internal conditions that impact test development and use, test use internationally, together with standards and guidelines for test development and use are summarised. Regional and international organisations providing leadership in test development and use as well as leadership efforts by the International Test Commission and others are discussed."
- id: N-T3-4
  title: "Oakland, T., & Lane, H. B. (2004). Language, reading, and readability formulas: Implications for developing and adapting tests. International Journal of Testing, 4(3), 239-252 (abstract via OpenAlex)"
  url: "https://api.openalex.org/works/doi:10.1207/s15327574ijt0403_3"
  accessed: "2026-11-23"
  quote: "Strengths and limitations associated with the use of readability formulas are discussed. Their use should be confined to paragraphs and longer passages, not items."
- id: N-T3-5
  title: "Oakland, T., Iliescu, D., Chen, H.-Y., & Chen, J. H. (2013). Cross-national assessment of adaptive behavior in three countries. Journal of Psychoeducational Assessment, 31(5), 435-447 (Crossref abstract), background"
  url: "https://api.crossref.org/works/10.1177/0734282912469492"
  accessed: "2026-11-23"
  quote: "Measures that assess adaptive behaviors typically have been built in Western cultures and developed in light of behaviors common to them. Nevertheless, these measures are used elsewhere despite a paucity of data that examine their cross-national transportability."
- id: N-T3-6
  title: "Oakland, T., Iliescu, D., Chen, H.-Y., & Chen, J. H. (2013), Crossref abstract, results"
  url: "https://api.crossref.org/works/10.1177/0734282912469492"
  accessed: "2026-11-23"
  quote: "Scale reliabilities are high and comparable for all the three versions. Correlation patterns are sufficiently similar between the three versions."
